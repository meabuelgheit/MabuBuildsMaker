<button class="toggle-ui-btn" (click)="uiState.toggle()" title="Toggle UI">
  {{ uiState.hideUI ? '+' : '−' }}
</button>

@if (!uiState.hideUI) {
  <div class="toolbar-wrapper">
    <div class="toolbar">
      <a class="project-title" routerLink="/">Mabu Builds Maker</a>

      <nav class="toolbar-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Workspace</a>
        <a routerLink="/groups" routerLinkActive="active">Groups</a>
        <a routerLink="/builds" routerLinkActive="active">Builds</a>
        <a routerLink="/settings" routerLinkActive="active">Settings</a>
      </nav>
    </div>
  </div>
}

<router-outlet />
<app-toast-host />
